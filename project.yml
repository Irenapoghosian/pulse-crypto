name: Pulse
options:
  bundleIdPrefix: com.irenapoghosyan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: G6AA4T82BJ

packages:
  PulseKit:
    path: Packages/PulseKit

targets:
  Pulse:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: PulseWidget
      - package: PulseKit
        product: Domain
      - package: PulseKit
        product: DataLayer
      - package: PulseKit
        product: DesignSystem
      - package: PulseKit
        product: MarketsFeature
      - package: PulseKit
        product: CoinDetailFeature
      - package: PulseKit
        product: PortfolioFeature
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CoinGeckoAPIKey: $(COINGECKO_API_KEY)
        # Widgets open coins with pulse://coin/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.irenapoghosyan.pulsecrypto
            CFBundleURLSchemes: [pulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenapoghosyan.pulsecrypto
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Home Screen widgets. Reuses the app's modules; only the wiring lives here.
  PulseWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: PulseKit
        product: Domain
      - package: PulseKit
        product: DataLayer
      - package: PulseKit
        product: DesignSystem
      - package: PulseKit
        product: WidgetFeature
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CoinGeckoAPIKey: $(COINGECKO_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenapoghosyan.pulsecrypto.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  Pulse:
    build:
      targets:
        Pulse: all
    # ⌘U on the app scheme runs every module's tests.
    test:
      gatherCoverageData: true
      targets:
        - package: PulseKit/DomainTests
        - package: PulseKit/NetworkingTests
        - package: PulseKit/DesignSystemTests
        - package: PulseKit/DataLayerTests
        - package: PulseKit/MarketsFeatureTests
        - package: PulseKit/CoinDetailFeatureTests
        - package: PulseKit/PortfolioFeatureTests
        - package: PulseKit/WidgetFeatureTests

  # Running this scheme puts a widget straight onto the simulator's Home Screen.
  # Change _XCWidgetKind to WatchlistWidget (and the family to systemMedium) to see the other one.
  PulseWidget:
    build:
      targets:
        PulseWidget: all
        Pulse: all
    run:
      config: Debug
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"
      environmentVariables:
        _XCWidgetKind: CoinWidget
        _XCWidgetFamily: systemSmall
        _XCWidgetDefaultView: timeline
